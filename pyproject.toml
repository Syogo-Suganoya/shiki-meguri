[project]
name = "shiki-meguri"
version = "0.1.0"
description = "シキめぐり — 冠婚葬祭レンタル×移動エージェント"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "google-cloud-firestore>=2.16",
]

[project.optional-dependencies]
# mock モードでは import されない。live 切替時にのみ必要。
gcp = [
    "google-adk>=1.0.0",
    "google-genai>=0.5.0",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
